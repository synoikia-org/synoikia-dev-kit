name: Update security-audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: cloudflare/security-audit-skill
      BRANCH: update/security-audit
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the pull request for a new upstream commit
        run: |
          old=$(jq -r '.plugins[] | select(.name == "security-audit") | .source.sha' .claude-plugin/marketplace.json)
          new=$(git ls-remote "https://github.com/$UPSTREAM" refs/heads/main | cut -f1)
          [ -n "$old" ] && [ -n "$new" ] || { echo "::error::cannot read the pinned or the upstream sha"; exit 1; }
          if [ "$old" = "$new" ]; then
            echo "security-audit is at the upstream head $new"
            exit 0
          fi

          # sed keeps the file's formatting, which jq would rewrite.
          sed -i "s/$old/$new/" .claude-plugin/marketplace.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git commit -am "security-audit moves to ${new:0:7}"
          git push --force origin "$BRANCH"

          body="The \`security-audit\` plugin moves from \`${old:0:7}\` to \`${new:0:7}\` of [$UPSTREAM](https://github.com/$UPSTREAM).

          Read the upstream changes before you merge: https://github.com/$UPSTREAM/compare/$old...$new

          The skill tells the agent to run its \`.cjs\` scripts. Check changes to them as code that runs in every session."
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --title "security-audit moves to ${new:0:7}" --body "$body"
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "security-audit moves to ${new:0:7}" --body "$body"
          fi
